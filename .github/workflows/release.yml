name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Calculate version
        id: version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git rev-list --all --oneline)
          else
            COMMITS=$(git rev-list $LAST_TAG..HEAD --oneline)
          fi
          
          # Determine version bump
          BREAKING=$(echo "$COMMITS" | grep -c "^.*!:" || true)
          FEATURES=$(echo "$COMMITS" | grep -c "^.*feat:" || true)
          FIXES=$(echo "$COMMITS" | grep -c "^.*fix:" || true)
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=${PATCH:-0}
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          if [ $BREAKING -gt 0 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            SHOULD_RELEASE=true
          elif [ $FEATURES -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            SHOULD_RELEASE=true
          elif [ $FIXES -gt 0 ]; then
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            SHOULD_RELEASE=true
          else
            SHOULD_RELEASE=false
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Version calculated: $NEW_VERSION (should_release: $SHOULD_RELEASE)"

      - name: Install dependencies
        if: ${{ steps.version.outputs.should_release == 'true' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Update version files
        if: ${{ steps.version.outputs.should_release == 'true' }}
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Generate changelog
        if: ${{ steps.version.outputs.should_release == 'true' }}
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="$LAST_TAG..HEAD"
          fi
          
          # Generate changelog entries
          CHANGELOG=$(git log $COMMIT_RANGE --pretty=format:"%h - %s (%an)")
          
          # Save to file for later use
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          # Use EOF delimiter for multi-line output with special characters
          {
            echo "changelog<<EOF"
            cat /tmp/changelog.txt | head -20
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and tag
        if: ${{ steps.version.outputs.should_release == 'true' }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin $(git rev-parse --abbrev-ref HEAD)
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.should_release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Changes in v${{ steps.version.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
