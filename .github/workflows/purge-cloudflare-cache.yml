name: Deploy to Pages & Purge Cloudflare Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Generate SEO files (robots.txt & sitemap.xml)
        run: |
          node scripts/generate-seo-files.js
        env:
          DOMAIN: ${{ secrets.PAGES_DOMAIN || 'cancionero.example.com' }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare Cache
        if: ${{ secrets.CLOUDFLARE_ZONE_ID && secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🔄 Purgando caché de Cloudflare..."
          
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://${{ secrets.PAGES_DOMAIN || "cancionero.example.com" }}/index.html",
                "https://${{ secrets.PAGES_DOMAIN || "cancionero.example.com" }}/sitemap.xml",
                "https://${{ secrets.PAGES_DOMAIN || "cancionero.example.com" }}/robots.txt",
                "https://${{ secrets.PAGES_DOMAIN || "cancionero.example.com" }}/",
                "https://${{ secrets.PAGES_DOMAIN || "cancionero.example.com" }}/*"
              ]
            }')
          
          echo "$RESPONSE" | jq .
          
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Caché purgado exitosamente"
          else
            echo "❌ Error purgando caché"
            echo "$RESPONSE" | jq .
            exit 1
          fi

      - name: Notify Deployment
        if: always()
        run: |
          echo "🎉 Deployment completado:"
          echo "   📍 Dominio: ${{ secrets.PAGES_DOMAIN || 'cancionero.example.com' }}"
          echo "   🔗 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "   ⏱️ Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
