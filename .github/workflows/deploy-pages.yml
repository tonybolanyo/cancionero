name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate version info
        run: npm run generate-version

      - name: Build application
        run: npm run build
        env:
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path || '/cancionero/' }}
          VITE_GITHUB_ALLOWED_USER: ${{ vars.VITE_GITHUB_ALLOWED_USER || 'tonygb' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare Cache
        if: ${{ always() && steps.deployment.outcome == 'success' && secrets.CLOUDFLARE_ZONE_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_DOMAIN: ${{ secrets.PAGES_DOMAIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${PAGES_URL:-}" ]; then
            BASE_URL="${PAGES_URL%/}"
          elif [ -n "${PAGES_DOMAIN:-}" ]; then
            BASE_URL="https://${PAGES_DOMAIN}"
          else
            echo "No se pudo determinar la URL de GitHub Pages ni el dominio de Cloudflare. Se omite la purga."
            exit 0
          fi

          if [ -n "${PAGES_DOMAIN:-}" ]; then
            DOMAIN="${PAGES_DOMAIN}"
          else
            DOMAIN="$(echo "${PAGES_URL:-}" | sed -E 's|https?://([^/]+).*|\1|')"
          fi

          if [ -z "${DOMAIN:-}" ]; then
            echo "No se pudo extraer el host del dominio. Se omite la purga."
            exit 0
          fi

          echo "🔄 Purging Cloudflare cache for ${BASE_URL}"

          JSON=$(jq -n             --arg base "${BASE_URL}"             '{files: [
              ($base + "/index.html"),
              ($base + "/sitemap.xml"),
              ($base + "/robots.txt"),
              ($base + "/"),
              ($base + "/*")
            ]}')

          echo "$JSON" | jq .

          RESPONSE=$(curl -sS -X POST             "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data "$JSON")

          echo "$RESPONSE" | jq .

          if ! echo "$RESPONSE" | jq -e '.success == true' >/dev/null; then
            echo "❌ Error purgando caché de Cloudflare"
            exit 1
          fi

          echo "✅ Cloudflare cache purged successfully"

      - name: Notify Deployment
        if: always()
        run: |
          echo "🎉 Deployment completado:"
          echo "   🔗 URL: ${{ steps.deployment.outputs.page_url || 'N/A' }}"
          echo "   📍 Dominio: ${{ secrets.PAGES_DOMAIN || 'github-pages' }}"
          echo "   ⏱️ Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

